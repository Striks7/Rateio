<title>Rateio da Fatura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra de navegação com três telas (Início, Rateio, Histórico). O rateio abre com um "cartão de crédito" colorido que resume a fatura, lançamentos à esquerda e pessoas à direita. */
:root {
  --bg: #F3F6FB; --surface: #FFFFFF; --sunken: #EDF1F7; --ink: #0F1A2E; --muted: #5A6579; --line: #E1E6EF;
  --brand: #0E9F6E; --brand-strong: #0A7E57; --brand-ink: #FFFFFF; --brand-soft: #DCF5EA; --sun: #FFB020; --sun-soft: #FFF3D6; --sun-icon: #D97706;
  --warn: #B4450B; --warn-bg: #FFEEDD; --ok: #047857; --ok-bg: #D7F5E7; --bad: #D42626;
  --card-1: #0B4F5C; --card-2: #0E9F6E; --card-glow: #FFC24A; --card-glow-2: #FF7A8A; --on-card: #FFFFFF; --card-dim: rgba(255,255,255,.72); --card-track: rgba(255,255,255,.18); --card-field: rgba(255,255,255,.14);
  --p0: #2563EB; --p1: #DB2777; --p2: #7C3AED; --p3: #C2410C; --p4: #047857; --p5: #0E7490; --p6: #A16207; --p7: #DC2626; --on-p: #FFFFFF;
  --shadow: 0 1px 2px rgba(15,26,46,.05), 0 8px 24px rgba(15,26,46,.06);
  --overlay: rgba(15,26,46,.45);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1120; --surface: #121B2D; --sunken: #0D1526; --ink: #E7ECF6; --muted: #96A1B8; --line: #22304A;
  --brand: #34D399; --brand-strong: #6EE7B7; --brand-ink: #052E21; --brand-soft: #0F3A2C; --sun: #FFC24A; --sun-soft: #3A2C0E; --sun-icon: #FFC24A;
  --warn: #FDA36B; --warn-bg: #3A2212; --ok: #4ADE9F; --ok-bg: #0F3A2C; --bad: #F87171;
  --card-1: #0A3440; --card-2: #0B7552;
  --p0: #60A5FA; --p1: #F472B6; --p2: #A78BFA; --p3: #FB923C; --p4: #34D399; --p5: #22D3EE; --p6: #FACC15; --p7: #F87171; --on-p: #0A1120;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --overlay: rgba(0,0,0,.6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0A1120; --surface: #121B2D; --sunken: #0D1526; --ink: #E7ECF6; --muted: #96A1B8; --line: #22304A;
  --brand: #34D399; --brand-strong: #6EE7B7; --brand-ink: #052E21; --brand-soft: #0F3A2C; --sun: #FFC24A; --sun-soft: #3A2C0E; --sun-icon: #FFC24A;
  --warn: #FDA36B; --warn-bg: #3A2212; --ok: #4ADE9F; --ok-bg: #0F3A2C; --bad: #F87171;
  --card-1: #0A3440; --card-2: #0B7552;
  --p0: #60A5FA; --p1: #F472B6; --p2: #A78BFA; --p3: #FB923C; --p4: #34D399; --p5: #22D3EE; --p6: #FACC15; --p7: #F87171; --on-p: #0A1120;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --overlay: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800; line-height: 1.05; }
h2 { font-size: 20px; font-weight: 800; }
h3 { font-size: 16px; font-weight: 800; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1200px; margin-inline: auto; }

/* navegação */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.nav .inner { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 19px; text-decoration: none; color: var(--ink); }
.logo { display: inline-flex; }
.logo i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -7px; }
.logo i:first-child { margin-left: 0; background: var(--p0); } .logo i:nth-child(2) { background: var(--p1); } .logo i:nth-child(3) { background: var(--sun); }
.tabs { display: flex; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 999px; flex-wrap: wrap; }
.tab { text-decoration: none; color: var(--muted); font-weight: 700; font-size: 14px; padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-current=page] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tab.off { opacity: .45; pointer-events: none; }
.nav-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.theme { display: inline-flex; gap: 2px; padding: 4px; border: 0; border-radius: 999px; background: var(--sunken); }
.theme .ic { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); transition: background .2s ease, color .2s ease; }
.theme .ic.on { background: var(--surface); box-shadow: var(--shadow); }
.theme .sun.on { color: var(--sun-icon); }
.theme .moon.on { color: var(--p2); }
.theme:hover .ic:not(.on) { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .theme .ic { transition: none; } }
.who { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; }

/* login */
body:not(.unlocked) .nav, body:not(.unlocked) main { display: none; }
body.unlocked .auth { display: none; }
.auth { min-height: 100vh; display: grid; place-items: center; padding-block: 32px;
  background: radial-gradient(circle at 12% 18%, color-mix(in srgb, var(--p1) 18%, transparent) 0 180px, transparent 181px), radial-gradient(circle at 88% 82%, color-mix(in srgb, var(--sun) 22%, transparent) 0 220px, transparent 221px), var(--bg); }
.auth-card { width: min(420px, 100%); padding: 28px; display: grid; gap: 18px; }
.auth-card .brand { justify-content: center; font-size: 22px; }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 999px; }
.auth-tabs button { border: 0; background: none; padding: 8px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.auth-tabs button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.auth form { display: grid; gap: 12px; }
.auth label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.auth label input { font-size: 15px; font-weight: 600; color: var(--ink); }
.auth .btn { justify-content: center; }
.msg { font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 10px; }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.msg.err { background: var(--warn-bg); color: var(--warn); }
.msg.info { background: var(--sunken); color: var(--muted); }
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--overlay); }
.modal-card { width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 22px; display: grid; gap: 14px; }
.acc { display: grid; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.acc-top { display: flex; align-items: center; gap: 10px; }
.acc-top .av { --c: var(--p0); }
.acc-name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.acc-name small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
.acc form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--warn-bg); padding: 10px; border-radius: 12px; }
.acc form p { flex-basis: 100%; font-size: 13px; font-weight: 600; color: var(--warn); }
.acc form input { flex: 1 1 160px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--brand-ink); }
.hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
.code-input { letter-spacing: .3em; text-transform: uppercase; text-align: center; font-size: 20px !important; }

main { padding-block: 24px 64px; }
.view { display: grid; gap: 20px; }

/* botões e campos */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; border-radius: 12px; font-weight: 700; text-decoration: none; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.link { border: 0; background: none; padding: 2px 0; color: var(--brand-strong); font-size: 13px; font-weight: 700; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link.danger { color: var(--bad); }
.link.quiet { color: var(--muted); }
input[type=text], input[type=email], input[type=password], input[type=search], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
select { padding-right: 28px; }
textarea { width: 100%; min-height: 140px; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }

.notice { border-radius: 14px; padding: 12px 16px; display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); }
.notice.ok { background: var(--ok-bg); border-color: transparent; }
.notice.warn { background: var(--warn-bg); border-color: transparent; }
.row > input { flex: 1 1 180px; }
pre.raw { max-height: 220px; overflow: auto; background: var(--sunken); padding: 10px; font: 12px/1.5 ui-monospace, Consolas, monospace; margin: 8px 0 0; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* início */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.hero-copy { display: grid; gap: 16px; }
.hero-copy .lead { font-size: 17px; color: var(--muted); max-width: 46ch; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--sun-soft) 62%); }
.steps { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 10px; }
.steps li { display: flex; gap: 12px; align-items: center; font-weight: 600; }
.steps b { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: var(--on-p); background: var(--c); }
.drop { position: relative; display: grid; place-items: center; text-align: center; gap: 12px; min-height: 300px; padding: 28px; border-radius: 24px; border: 2px dashed var(--line); background: var(--surface); cursor: pointer; overflow: hidden; }
.drop:hover, body.dragging .drop { border-color: var(--brand); background: var(--brand-soft); }
.drop-art { position: relative; width: 190px; height: 120px; }
.mini-card { position: absolute; width: 150px; height: 94px; border-radius: 14px; box-shadow: var(--shadow); }
.mini-card.a { left: 0; top: 18px; transform: rotate(-9deg); background: linear-gradient(135deg, var(--p1), var(--sun)); }
.mini-card.b { right: 0; top: 0; transform: rotate(6deg); background: linear-gradient(135deg, var(--card-1), var(--card-2)); }
.mini-card.b::after { content: ""; position: absolute; left: 16px; top: 30px; width: 26px; height: 20px; border-radius: 4px; background: var(--card-glow); }
.drop strong { font-family: var(--display); font-size: 20px; }
.saved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.saved { padding: 16px; display: grid; gap: 10px; }
.saved .month { font-family: var(--display); font-weight: 800; font-size: 18px; }
.saved .tot { font-size: 22px; font-weight: 800; }

/* cartão-resumo */
.top-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.ccard { position: relative; overflow: hidden; border-radius: 24px; padding: 22px; color: var(--on-card); display: grid; gap: 16px;
  background: radial-gradient(circle at 92% -10%, var(--card-glow) 0 90px, transparent 91px), radial-gradient(circle at 78% -18%, var(--card-glow-2) 0 110px, transparent 111px), linear-gradient(135deg, var(--card-1), var(--card-2)); box-shadow: var(--shadow); }
.cc-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.cc-month { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cc-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--card-dim); }
.ccard select { background: var(--card-field); color: var(--on-card); border-color: transparent; font-weight: 700; }
.ccard select option { color: var(--ink); background: var(--surface); }
.ccard select.need { outline: 2px solid var(--card-glow); }
.chipico { width: 42px; height: 32px; border-radius: 7px; background: linear-gradient(135deg, var(--card-glow), #E3A31A); position: relative; }
.chipico::after { content: ""; position: absolute; inset: 8px 6px; border: 1.5px solid rgba(0,0,0,.25); border-radius: 3px; }
.cc-total { display: grid; gap: 2px; }
#totalInput { font: 800 clamp(30px, 5vw, 42px)/1.1 var(--body); font-variant-numeric: tabular-nums; width: 100%; max-width: 340px; padding: 2px 6px; margin-left: -7px; color: var(--on-card); background: transparent; border: 1px solid transparent; border-radius: 10px; }
#totalInput:hover, #totalInput:focus { background: var(--card-field); }
#totalInput::placeholder { color: var(--card-dim); }
.cc-figs { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.cc-figs div { display: grid; }
.cc-figs b { font-size: 18px; font-variant-numeric: tabular-nums; }
.cbar { display: flex; gap: 3px; height: 14px; border-radius: 99px; background: var(--card-track); padding: 3px; }
.cbar > span { display: block; min-width: 4px; border-radius: 99px; background: var(--c); transition: flex-grow .3s ease; }
.cbar > .rest { background: repeating-linear-gradient(135deg, transparent 0 4px, var(--card-track) 4px 7px); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 12px; }
.check.ok { background: var(--ok-bg); color: var(--ok); }
.check.warn { background: var(--warn-bg); color: var(--warn); }
.check.info { background: var(--sunken); color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .cbar > span { transition: none; } }

/* pessoas */
.people-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); max-height: calc(100vh - 90px); overflow-y: auto; }
.people-panel form { display: flex; gap: 8px; }
.people-panel form input { flex: 1; }
.av { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: var(--on-p); font-weight: 800; font-size: 13px; }
.av.sm { width: 22px; height: 22px; font-size: 10px; }
.pp { padding: 14px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.pp-top { display: flex; align-items: center; gap: 10px; }
.pp-name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.pp-name small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
.pp-total { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { height: 6px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.track > span { display: block; height: 100%; border-radius: 99px; background: var(--c); }
.xbtn { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 8px; }
.xbtn:hover { background: var(--sunken); color: var(--bad); }
.pp-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.pp-items li { display: flex; justify-content: space-between; gap: 10px; }
.pp-items li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.foot { padding: 14px 18px; display: grid; gap: 10px; }
.empty-p { padding: 22px 18px; color: var(--muted); text-align: center; }

/* lançamentos */
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--muted); }
.filter[aria-pressed=true] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
#search { flex: 1 1 180px; padding: 6px 12px; border-radius: 999px; }
.bulk { background: var(--brand-soft); padding: 10px 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.tx { display: grid; grid-template-columns: 18px 46px minmax(0, 1fr) auto; gap: 6px 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); align-items: start; }
.tx:last-child { border-bottom: 0; }
.tx:hover { background: color-mix(in srgb, var(--sunken) 55%, transparent); }
.tx input[type=checkbox] { margin: 13px 0 0; width: 16px; height: 16px; accent-color: var(--brand); }
.dbadge { display: grid; place-items: center; width: 46px; padding: 5px 0; border-radius: 12px; background: var(--sunken); line-height: 1.05; }
.dbadge b { font-size: 17px; font-weight: 800; }
.dbadge span { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tx-main { display: grid; gap: 8px; min-width: 0; }
.desc { font-weight: 700; overflow-wrap: anywhere; }
.parc { display: inline-block; font-size: 11px; font-weight: 800; color: var(--warn); background: var(--sun-soft); padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.amt { text-align: right; display: grid; gap: 4px; justify-items: end; }
.amt b { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt b.credit { color: var(--ok); }
.tx.off .desc, .tx.off .amt b { color: var(--muted); text-decoration: line-through; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 3px 11px 3px 3px; font-size: 13px; font-weight: 700; max-width: 170px; background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--ink); }
.chip .av { width: 22px; height: 22px; font-size: 10px; }
.chip span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { background: color-mix(in srgb, var(--c) 24%, transparent); }
.chip[aria-pressed=true] { background: var(--c); color: var(--on-p); }
.chip[aria-pressed=true] .av { background: var(--on-p); color: var(--c); }
.pill { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 99px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.tx-links { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.tx-extra { display: grid; gap: 8px; background: var(--sunken); padding: 12px; border-radius: 12px; }
.adjust-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.adjust-row input { width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
.edit { display: flex; flex-wrap: wrap; gap: 8px; }
.edit input { flex: 1 1 110px; }
.edit input.wide { flex: 3 1 200px; }
.empty { padding: 40px 18px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }

/* histórico */
.hfilters { padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.hfilters label { display: grid; gap: 4px; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; flex: 1 1 170px; }
.hfilters label > * { text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.pcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 16px; display: grid; gap: 10px; box-shadow: var(--shadow); position: relative; overflow: hidden; }

  var st = { mode: 'login', msg: null, email: '', fails: 0, lockUntil: 0, busy: false };

  function users() { try { return JSON.parse(localStorage.getItem(UKEY) || '[]'); } catch (e) { return []; } }
  function saveUsers(u) { try { localStorage.setItem(UKEY, JSON.stringify(u)); return true; } catch (e) { return false; } }
  function find(email) { var e = norm(email); return users().filter(function (u) { return u.email === e; })[0] || null; }
  function update(user) { var u = users().filter(function (x) { return x.email !== user.email; }); u.push(user); saveUsers(u); }
  function norm(e) { return String(e || '').trim().toLowerCase(); }
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function salt() { var a = new Uint8Array(16); crypto.getRandomValues(a); return b64(a.buffer); }
  function hash(secret, s) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(s), iterations: 150000, hash: 'SHA-256' }, k, 256);
    }).then(b64);
  }
  function code() {
    var abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', a = new Uint8Array(6), out = '';
    crypto.getRandomValues(a); for (var i = 0; i < 6; i++) out += abc[a[i] % abc.length];
    return out;
  }
  // ----- proteção contra robôs e tentativas repetidas -----
  var GKEY = 'rateio-fatura-protecao';
  var SEND_GAP = 60000, SEND_MAX = 5, SEND_WINDOW = 3600000, CODE_TTL = 15 * 60000, CODE_TRIES = 5;
  function guard() { try { return JSON.parse(localStorage.getItem(GKEY) || '{}'); } catch (e) { return {}; } }
  function saveGuard(g) { try { localStorage.setItem(GKEY, JSON.stringify(g)); } catch (e) { /* ok */ } }
  function waitText(ms) { return ms >= 60000 ? Math.ceil(ms / 60000) + ' minuto(s)' : Math.ceil(ms / 1000) + ' segundos'; }
  // No máximo 1 código por minuto para cada e-mail e 5 por hora neste computador.
  function sendBlock(email) {
    var g = guard(), now = Date.now(), list = (g.sends || []).filter(function (t) { return now - t < SEND_WINDOW; }), last = (g.last || {})[email] || 0;
    if (now - last < SEND_GAP) return 'Espere ' + waitText(SEND_GAP - (now - last)) + ' para pedir outro código.';
    if (list.length >= SEND_MAX) return 'Muitos códigos pedidos neste computador. Tente de novo em ' + waitText(SEND_WINDOW - (now - list[0])) + '.';
    return '';
  }
  function recordSend(email) {
    var g = guard(), now = Date.now();
    g.sends = (g.sends || []).filter(function (t) { return now - t < SEND_WINDOW; }).concat(now);
    g.last = g.last || {}; g.last[email] = now; saveGuard(g);
  }
  // Login: a cada 5 senhas erradas o e-mail fica bloqueado 1, 2, 4, 8... até 30 minutos.
  function lockLeft(email) { var f = (guard().fails || {})[email]; return f && f.until > Date.now() ? f.until - Date.now() : 0; }
  function addFail(email) {
    var g = guard(); g.fails = g.fails || {};
    var f = g.fails[email] || { n: 0, until: 0 }; f.n++;
    if (f.n % 5 === 0) f.until = Date.now() + Math.min(30, Math.pow(2, f.n / 5 - 1)) * 60000;
    g.fails[email] = f; saveGuard(g); return f;
  }
  function clearFails(email) { var g = guard(); if (g.fails && g.fails[email]) { delete g.fails[email]; saveGuard(g); } }
  // Verificação anti-robô: campo invisível (robôs preenchem), tempo mínimo e uma conta simples.
  function botFields() {
    var a = 1 + Math.floor(Math.random() * 9), b = 1 + Math.floor(Math.random() * 9);
    st.challenge = a + b; st.openedAt = Date.now();
    return '<div class="hp" aria-hidden="true"><label>Deixe em branco<input id="hpField" type="text" tabindex="-1" autocomplete="off"></label></div>' +
      field('hc', 'Verificação: quanto é ' + a + ' + ' + b + '?', 'text', 'inputmode="numeric" autocomplete="off" maxlength="3" required');
  }
  function botCheck() {
    if ($('hpField').value) return 'Não foi possível enviar. Tente de novo.';
    if (Date.now() - st.openedAt < 3000) return 'Confira os dados e tente de novo.';
    if (parseInt($('hc').value, 10) !== st.challenge) return 'A resposta da verificação está errada. Tente de novo.';
    return '';
  }
  function validEmail(e) { return e.length <= 100 && /^[^\s@]{1,64}@[^\s@]+\.[^\s@]{2,}$/.test(e); }
  function nameProblem(n) {
    if (n.length < 2 || n.length > 60) return 'Use um nome entre 2 e 60 caracteres.';
    if (/https?:|www\.|[<>@\/\\{}]/i.test(n)) return 'O nome não pode ter links nem símbolos como < > @ /.';
    return '';
  }
  function dropCode(cu) {
    if (cu.reset) { delete cu.reset; update(cu); }
    else saveUsers(users().filter(function (x) { return x.email !== cu.email; }));
  }

  function sendMail(params) {
    if (!CONFIG.serviceId || !CONFIG.templateId || !CONFIG.publicKey)
      return Promise.reject(new Error('O envio de e-mail ainda não foi configurado. Preencha as chaves do EmailJS (veja o LEIA-ME).'));
    return fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service_id: CONFIG.serviceId, template_id: CONFIG.templateId, user_id: CONFIG.publicKey, template_params: Object.assign({ data: new Date().toLocaleString('pt-BR') }, params) })
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error('O EmailJS recusou o envio: ' + (t || r.status)); });
    }, function () { throw new Error('Não consegui enviar o e-mail. Verifique a internet e tente de novo.'); });
  }

  function msg(type, text) { st.msg = { type: type, text: text }; }
  function field(id, label, type, extra) { return '<label>' + label + '<input id="' + id + '" type="' + type + '" ' + (extra || '') + '></label>'; }
  function render() {
    var m = st.mode, h = '';
    if (m === 'login' || m === 'signup') {
      h += '<div class="auth-tabs"><button type="button" data-auth="login" aria-pressed="' + (m === 'login') + '">Entrar</button><button type="button" data-auth="signup" aria-pressed="' + (m === 'signup') + '">Criar conta</button></div>';
    }
    if (st.msg) h += '<div class="msg ' + st.msg.type + '" role="status">' + esc(st.msg.text) + '</div>';
    if (m === 'login') {
      h += '<form id="fLogin">' + field('aEmail', 'E-mail', 'email', 'autocomplete="username" required value="' + esc(st.email) + '"') + field('aPass', 'Senha', 'password', 'autocomplete="current-password" required') +
        '<button class="btn primary" type="submit">Entrar</button></form>' +
        '<div class="between small"><button class="link" type="button" data-auth="reset">Esqueci a senha</button><button class="link" type="button" data-auth="code">Tenho um código</button></div>';
    } else if (m === 'signup') {
      h += '<form id="fSignup">' + field('sName', 'Nome', 'text', 'autocomplete="name" required') + field('sEmail', 'E-mail', 'email', 'autocomplete="username" required') +
        field('sPass', 'Senha (mínimo 8 caracteres)', 'password', 'autocomplete="new-password" minlength="8" required') + field('sPass2', 'Repita a senha', 'password', 'autocomplete="new-password" required') +
        botFields() + '<button class="btn primary" type="submit"' + (st.busy ? ' disabled' : '') + '>' + (st.busy ? 'Enviando pedido…' : 'Pedir cadastro') + '</button></form>' +
        '<p class="small muted">Vamos mandar um código para o seu e-mail. A conta só funciona depois que você digitar esse código.</p>';
    } else if (m === 'code') {
      h += '<h2>Código de confirmação</h2><p class="small muted">Digite o código de 6 letras e números que chegou no seu e-mail. Ele vale por 15 minutos. Se não encontrar, olhe também o Spam.</p>' +
        '<form id="fCode">' + field('cEmail', 'E-mail da conta', 'email', 'required value="' + esc(st.email) + '"') + field('cCode', 'Código', 'text', 'class="code-input" maxlength="6" autocomplete="one-time-code" required') +
        '<button class="btn primary" type="submit">Confirmar</button></form><button class="link" type="button" data-auth="login">Voltar para o login</button>';
    } else if (m === 'reset') {
      h += '<h2>Trocar a senha</h2><p class="small muted">Vamos mandar um código para o e-mail da conta. Com ele, a nova senha passa a valer.</p>' +
        '<form id="fReset">' + field('rEmail', 'E-mail da conta', 'email', 'required value="' + esc(st.email) + '"') + field('rPass', 'Nova senha (mínimo 8 caracteres)', 'password', 'autocomplete="new-password" minlength="8" required') + field('rPass2', 'Repita a nova senha', 'password', 'autocomplete="new-password" required') +
        botFields() + '<button class="btn primary" type="submit"' + (st.busy ? ' disabled' : '') + '>' + (st.busy ? 'Enviando…' : 'Pedir troca de senha') + '</button></form><button class="link" type="button" data-auth="login">Voltar para o login</button>';
    }
    $('authBody').innerHTML = h;
    var first = $('authBody').querySelector('input:not([value]), input[value=""]') || $('authBody').querySelector('input');
    if (first) first.focus();
  }
  function go(mode) { st.mode = mode; st.msg = null; render(); }

  // ----- contas: o dono do sistema pode excluir qualquer conta; os outros, só a própria -----
  var OWNER = 'nicolasrenan10@gmail.com', current = null, acc = { confirm: null, msg: null };
  function isOwner() { return current && current.email === OWNER; }
  function canDelete(u) { return isOwner() || (current && u.email === current.email); }
  function initials(n) { var w = String(n || '?').trim().split(/\s+/); return ((w[0] || '?')[0] + (w.length > 1 ? w[w.length - 1][0] : (w[0][1] || ''))).toUpperCase(); }
  function renderAcc() {
    var list = users().sort(function (a, b) { return a.name.localeCompare(b.name); });
    var h = '<div class="between"><h2 id="accTitle">Contas neste computador</h2><button class="xbtn" type="button" data-acc="close" aria-label="Fechar">×</button></div>' +
      '<p class="small muted">' + (isOwner() ? 'Como dono do sistema, você pode excluir qualquer conta.' : 'Você pode excluir a sua própria conta.') + ' Cada conta tem as próprias faturas, e excluir a conta apaga as faturas dela.</p>';
    if (acc.msg) h += '<div class="msg ' + acc.msg.type + '" role="status">' + esc(acc.msg.text) + '</div>';
    h += list.map(function (u) {
      var me = current && u.email === current.email;
      var row = '<div class="acc"><div class="acc-top"><span class="av" aria-hidden="true">' + esc(initials(u.name)) + '</span><span class="acc-name">' + esc(u.name) + (me ? ' <span class="pill ok">Você</span>' : '') +
        '<small>' + esc(u.email) + ' · ' + (u.status === 'aprovado' ? 'confirmada' : 'esperando o código') + '</small></span>' +
        (canDelete(u) && acc.confirm !== u.email ? '<button class="link danger" type="button" data-acc="ask" data-email="' + esc(u.email) + '">Excluir</button>' : '') + '</div>';
      if (acc.confirm === u.email) {
        row += '<form id="fDel" data-email="' + esc(u.email) + '"><p>' + (me ? 'Sua conta e todas as suas faturas serão excluídas, e você sairá do sistema.' : 'A conta de ' + esc(u.name) + ' e todas as faturas dela serão excluídas.') + ' Não dá para desfazer. Para confirmar, digite a sua senha.</p>' +
          '<input id="delPass" type="password" autocomplete="current-password" aria-label="Sua senha" placeholder="Sua senha" required><button class="btn danger sm" type="submit">Excluir conta</button><button class="btn sm" type="button" data-acc="cancel">Cancelar</button></form>';
      }
      return row + '</div>';
    }).join('');
    $('accBody').innerHTML = h;
    var p = $('delPass'); if (p) p.focus();
  }
  function openAcc() { acc = { confirm: null, msg: null }; $('accModal').hidden = false; renderAcc(); }
  function closeAcc() { $('accModal').hidden = true; $('accountsBtn').focus(); }

  function unlock(user) {
    current = user;
    try { sessionStorage.setItem(SKEY, user.email); } catch (e) { /* sessão só na memória */ }
    document.body.classList.add('unlocked');
    $('whoami').textContent = user.name;
    window.__startApp(user.email, user.email === OWNER);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-auth]'); if (b) { go(b.dataset.auth); return; }
    if (e.target.id === 'accountsBtn') { openAcc(); return; }
    if (e.target.id === 'accModal') { closeAcc(); return; }
    var a = e.target.closest('[data-acc]');
    if (a) {
      if (a.dataset.acc === 'close') closeAcc();
      else if (a.dataset.acc === 'ask') { acc.confirm = a.dataset.email; acc.msg = null; renderAcc(); }
      else if (a.dataset.acc === 'cancel') { acc.confirm = null; renderAcc(); }
      return;
    }
    if (e.target.id === 'logoutBtn') { try { sessionStorage.removeItem(SKEY); } catch (er) { /* ok */ } location.reload(); }
  });
  document.addEventListener('submit', function (e) {
    var id = e.target.id; if (['fLogin', 'fSignup', 'fCode', 'fReset', 'fDel'].indexOf(id) < 0) return;
    e.preventDefault(); e.stopImmediatePropagation();

    if (id === 'fDel') {
      var target = e.target.dataset.email, me = find(current.email);
      if (!me || !canDelete({ email: target })) return;
      var dl = lockLeft(me.email);
      if (dl) { acc.msg = { type: 'err', text: 'Muitas senhas erradas. Espere ' + waitText(dl) + '.' }; renderAcc(); return; }
      hash($('delPass').value, me.salt).then(function (h) {
        if (h !== me.pass) { addFail(me.email); acc.msg = { type: 'err', text: 'Senha incorreta. A conta não foi excluída.' }; renderAcc(); return; }
        clearFails(me.email);
        var gone = find(target);
        saveUsers(users().filter(function (u) { return u.email !== target; }));
        try { localStorage.removeItem('rateio-fatura-v2:' + target); } catch (er) { /* ok */ }
        if (target === current.email) { try { sessionStorage.removeItem(SKEY); } catch (er) { /* ok */ } location.reload(); return; }
        acc.confirm = null; acc.msg = { type: 'ok', text: 'Conta de ' + (gone ? gone.name : target) + ' excluída.' }; renderAcc();
      });
    }

    if (id === 'fLogin') {
      var email = norm($('aEmail').value), pass = $('aPass').value, u = find(email);
      st.email = email;
      var left = lockLeft(email);
      if (left) { msg('err', 'Muitas senhas erradas para esse e-mail. Espere ' + waitText(left) + ' para tentar de novo.'); render(); return; }
      (u ? hash(pass, u.salt) : hash(pass, 'sem-conta')).then(function (h) {
        if (!u || h !== u.pass) {
          var f = addFail(email);
          msg('err', f.until > Date.now() ? 'Muitas senhas erradas. Esse e-mail ficou bloqueado por ' + waitText(f.until - Date.now()) + '.' : 'E-mail ou senha incorretos.');
          render(); return;
        }
        clearFails(email);
        if (u.status !== 'aprovado') { st.mode = 'code'; msg('info', 'Sua conta ainda não foi confirmada. Digite o código que chegou no seu e-mail.'); render(); return; }
        unlock(u);
      });
    }

    if (id === 'fSignup') {
      var name = $('sName').value.trim().replace(/\s+/g, ' '), em = norm($('sEmail').value), p1 = $('sPass').value, p2 = $('sPass2').value, ex = find(em);
      var bot = botCheck(); if (bot) { msg('err', bot); render(); return; }
      var np = nameProblem(name); if (np) { msg('err', np); render(); return; }
      if (!validEmail(em)) { msg('err', 'Digite um e-mail válido.'); render(); return; }
      if (p1.length < 8) { msg('err', 'A senha precisa ter pelo menos 8 caracteres.'); render(); return; }
      if (p1 !== p2) { msg('err', 'As duas senhas não são iguais.'); render(); return; }
      if (ex && ex.status === 'aprovado') { msg('err', 'Já existe uma conta com esse e-mail. Use "Entrar".'); render(); return; }
      var sb = sendBlock(em); if (sb) { msg('err', sb); render(); return; }
      var s = salt(), c = code();
      recordSend(em); st.busy = true; st.email = em; render();
      sendMail({ to_email: em, tipo: 'Confirmação de cadastro', nome: name, usuario: em, codigo: c }).then(function () {
        return Promise.all([hash(p1, s), hash(c, s)]);
      }).then(function (h) {
        update({ email: em, name: name, salt: s, pass: h[0], status: 'pendente', code: h[1], codeExp: Date.now() + CODE_TTL, tries: 0, created: Date.now() });
        st.busy = false; st.mode = 'code';
        msg('ok', 'Enviamos um código para ' + em + '. Digite ele aqui para ativar a conta.');
        render();
      }).catch(function (err) { st.busy = false; msg('err', err.message); render(); });
    }

    if (id === 'fCode') {
      var ce = norm($('cEmail').value), cc = $('cCode').value.toUpperCase().replace(/[^A-Z0-9]/g, ''), cu = find(ce);
      st.email = ce;
      if (!cu || (!cu.code && !cu.reset)) { msg('err', 'Não há código pendente para esse e-mail.'); render(); return; }
      var exp = cu.reset ? cu.reset.exp : cu.codeExp;
      if (exp && Date.now() > exp) { dropCode(cu); msg('err', 'Esse código expirou (vale 15 minutos). Peça um novo.'); render(); return; }
      hash(cc, cu.salt).then(function (h) {
        if (cu.reset && h === cu.reset.code) { cu.pass = cu.reset.pass; cu.salt = cu.reset.salt; delete cu.reset; update(cu); clearFails(ce); st.mode = 'login'; msg('ok', 'Senha trocada. Entre com a nova senha.'); render(); return; }
        if (cu.code && h === cu.code) { cu.status = 'aprovado'; delete cu.code; delete cu.codeExp; delete cu.tries; update(cu); st.mode = 'login'; msg('ok', 'Conta confirmada. Agora entre com sua senha.'); render(); return; }
        var holder = cu.reset || cu; holder.tries = (holder.tries || 0) + 1;
        if (holder.tries >= CODE_TRIES) { dropCode(cu); msg('err', 'Código bloqueado depois de ' + CODE_TRIES + ' tentativas erradas. Peça um novo código.'); render(); return; }
        update(cu); var rest = CODE_TRIES - holder.tries; msg('err', 'Código incorreto. ' + (rest === 1 ? 'Resta 1 tentativa.' : 'Restam ' + rest + ' tentativas.')); render();
      });
    }

    if (id === 'fReset') {
      var re = norm($('rEmail').value), r1 = $('rPass').value, r2 = $('rPass2').value, ru = find(re);
      st.email = re;
      var rb = botCheck(); if (rb) { msg('err', rb); render(); return; }
      if (!ru || ru.status !== 'aprovado') { msg('err', 'Não existe conta confirmada com esse e-mail.'); render(); return; }
      if (r1.length < 8) { msg('err', 'A senha precisa ter pelo menos 8 caracteres.'); render(); return; }
      if (r1 !== r2) { msg('err', 'As duas senhas não são iguais.'); render(); return; }
      var rsb = sendBlock(re); if (rsb) { msg('err', rsb); render(); return; }
      var ns = salt(), rc = code();
      recordSend(re); st.busy = true; render();
      sendMail({ to_email: re, tipo: 'Troca de senha', nome: ru.name, usuario: re, codigo: rc }).then(function () {
        return Promise.all([hash(r1, ns), hash(rc, ru.salt)]);
      }).then(function (h) {
        ru.reset = { salt: ns, pass: h[0], code: h[1], exp: Date.now() + CODE_TTL, tries: 0 }; update(ru);
        st.busy = false; st.mode = 'code';
        msg('ok', 'Enviamos um código para ' + re + '. Digite ele aqui para confirmar a nova senha.');
        render();
      }).catch(function (err) { st.busy = false; msg('err', err.message); render(); });
    }
  }, true);

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('accModal').hidden) closeAcc(); });

  // Ao abrir: se já entrou nesta janela, continua; senão mostra o login.
  var saved = null; try { saved = sessionStorage.getItem(SKEY); } catch (e) { /* ok */ }
  var su = saved ? find(saved) : null;
  if (su && su.status === 'aprovado') unlock(su);
  else { st.mode = users().length ? 'login' : 'signup'; render(); }
})();
</script>
